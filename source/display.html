<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Car Sign Live — Display</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{--split:50%}
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .hud{position:fixed;left:0;right:0;pointer-events:none}
  #top{top:0;padding:1.6vh 3vw 0;text-align:center}
  #title{font-size:3.9vh;font-weight:900;letter-spacing:.06em;line-height:1;
    background:linear-gradient(180deg,#fff7d6,#ffcf4d 55%,#c48a0c);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 .3vh .5vh rgba(0,0,0,.8))}
  #legend{margin-top:.9vh;display:flex;flex-wrap:wrap;gap:.5vh .6vh;justify-content:center}
  #legend span{font-size:1.45vh;font-weight:700;padding:.4vh 1vh;border-radius:99px;background:rgba(10,12,20,.62);border:1px solid rgba(255,207,77,.45);white-space:nowrap}
  #divider{position:fixed;left:0;right:0;top:var(--split);height:.45vh;transform:translateY(-50%);pointer-events:none;
    background:linear-gradient(90deg,transparent,#ffcf4d 15%,#fff3c4 50%,#ffcf4d 85%,transparent);box-shadow:0 0 1.6vh rgba(255,200,60,.8)}
  #likers{position:fixed;left:2.5%;top:20%;z-index:5;pointer-events:auto;cursor:move;transform-origin:top left;transform:scale(var(--ls,.75));
    background:rgba(8,10,16,.62);border:1px solid rgba(255,90,120,.45);border-radius:1.4vh;padding:.6vh .7vh .7vh;min-width:20vh;user-select:none;touch-action:none}
  #likers:hover{outline:1px dashed rgba(255,255,255,.5);outline-offset:2px}
  #lkHead{font-size:1.35vh;font-weight:800;color:#ffb3c6;padding:0 .4vh .5vh;white-space:nowrap}
  #lkList{display:flex;flex-direction:column;gap:.5vh}
  #lkResize{position:absolute;right:-.6vh;bottom:-.6vh;width:1.8vh;height:1.8vh;border-radius:50%;background:#ff6b8f;cursor:nwse-resize;opacity:0;transition:opacity .2s}
  #likers:hover #lkResize{opacity:1}
  .lk{display:flex;align-items:center;gap:.8vh;background:rgba(255,255,255,.06);border-radius:99px;padding:.35vh 1vh .35vh .35vh}
  .lk img{width:3.2vh;height:3.2vh;border-radius:50%;object-fit:cover;pointer-events:none}
  .lkb{width:12vh}.lkn{font-size:1.25vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:.7vh;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:.3vh}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff5f86,#ffb3c6);transition:width .4s}
  .lk b{font-size:1.3vh;color:#ff9ab2}
  #banner{top:var(--split);left:50%;right:auto;transform:translate(-50%,-50%) scale(.85);opacity:0;transition:all .45s cubic-bezier(.2,.9,.3,1.2);
    display:flex;align-items:center;gap:1.2vh;padding:.8vh 2.4vh .8vh .8vh;border-radius:99px;background:rgba(10,12,20,.85);border:2px solid #ffcf4d;max-width:90vw}
  #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #banner img{width:6vh;height:6vh;border-radius:50%;object-fit:cover;border:.3vh solid #fff}
  #bName{font-size:2.6vh;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
  #bTier{font-size:1.6vh;font-weight:700;opacity:.9;white-space:nowrap}
  #banner.t-silver{border-color:#dfe5ee;box-shadow:0 0 3vh rgba(220,230,255,.5)}
  #banner.t-gold{border-color:#ffcf4d;box-shadow:0 0 4vh rgba(255,200,60,.7)}
  #banner.t-logo{border-color:#ffcf4d;box-shadow:0 0 6vh rgba(255,200,60,.95);background:linear-gradient(90deg,rgba(80,10,20,.92),rgba(10,12,20,.92))}
  #banner.t-like{border-color:#ff6b8f}
  #camLabel{position:fixed;left:2.5vw;bottom:1.6vh;font-size:1.4vh;font-weight:700;opacity:.7;pointer-events:none;background:rgba(0,0,0,.35);padding:.3vh .9vh;border-radius:99px}
  #queue{position:fixed;right:2.5vw;bottom:1.6vh;font-size:1.5vh;font-weight:700;opacity:.8;pointer-events:none}
  #pump{position:fixed;top:calc(var(--split) * .72);left:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;transition:all .3s;text-align:center;pointer-events:none;
    background:rgba(10,12,20,.75);border:2px solid #ff6b8f;border-radius:2vh;padding:1.2vh 2.6vh}
  #pump.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #pump .t{font-size:1.9vh;font-weight:800;color:#ffb3c6}#pumpName{font-size:2.4vh;font-weight:900;margin:.3vh 0 .8vh}
  #pump .bar{height:1.4vh;width:26vh}#pump .bar i{transition:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2vh;opacity:.85;background:#05060a;text-align:center;padding:0 8vw}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="divider"></div>
<div id="top" class="hud"><div id="title"></div><div id="legend"></div></div>
<div id="likers"><div id="lkHead"></div><div id="lkList"></div><div id="lkResize" title="Kéo để đổi cỡ (hoặc lăn chuột)"></div></div>
<div id="pump"><div class="t">❤️ BƠM ĐẦY MỰC ❤️</div><div id="pumpName"></div><div class="bar"><i id="pumpBar"></i></div></div>
<div id="banner" class="hud"><img id="bAvatar" alt=""><div><div id="bName"></div><div id="bTier"></div></div></div>
<div id="camLabel"></div>
<div id="queue"></div>
<div id="loading">Đang khởi động…</div>
<script src="dist/display.bundle.js"></script>
</body>
</html>
